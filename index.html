<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイカツ！アンコール 排出配列メモ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#333;--sub:#666;--pri:#ff4081;--bd:#e0e0e0;--acc:#fff0f5;--hit:#ffe0ec;--next:#fff3b0}
[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--sub:#aaa;--bd:#333;--acc:#2a1b24;--hit:#4a1f33;--next:#5a4a00}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:60px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:14px;color:var(--pri)}
.hb{display:flex;gap:6px}
.chip{background:var(--acc);border:1px solid var(--pri);color:var(--pri);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;cursor:pointer}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:11px;background:none;border:none;border-bottom:3px solid transparent;color:var(--sub);font-weight:bold;font-size:14px}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
.wrap{max-width:600px;margin:0 auto;padding:12px}
.tab{display:none}.tab.on{display:block}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:15px}
textarea{resize:vertical}
#smemo{font-size:17px;font-weight:bold}
#stitle{font-size:20px;font-weight:bold;margin-bottom:10px}
.seq-t{font-size:20px;font-weight:bold;word-break:break-all}
.seq-m{font-size:15px;font-weight:bold;color:var(--sub);margin-top:2px;word-break:break-all}
.btn{background:var(--pri);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;white-space:nowrap}
.g{background:#757575}.r{background:#f44336}.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.seqb{max-height:112px;overflow-y:auto}
.lbl{font-size:11px;color:var(--sub);margin-top:8px}
.fb{padding:6px 12px;border:2px solid var(--bd);border-radius:16px;background:var(--card);color:var(--text);font-size:13px;font-weight:bold;cursor:pointer}
.fb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.fb.pr{border-color:#2196f3}.fb.pr.on{background:#2196f3;color:#fff}
.fb.st{border-color:#4caf50}.fb.st.on{background:#4caf50;color:#fff}
.sc{background:var(--acc);border:1px solid var(--pri);color:var(--pri);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:bold;cursor:pointer}
.isd{margin-top:8px;border:1px dashed var(--bd);border-radius:8px;padding:6px 8px}
.isd summary{font-size:12px;font-weight:bold;color:var(--pri);cursor:pointer}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px}
.pat{background:var(--acc);border-radius:8px;padding:8px;margin-top:8px}
.pat b{font-size:12px;color:var(--pri)}
.cn{font-size:12px;font-weight:bold;color:var(--sub);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1px 8px;margin-left:4px}
.lst{background:var(--card);border-radius:6px;margin-top:4px}
.cr{display:flex;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px}
.cr:last-child{border:none}
#seqList .cr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ix{min-width:26px;text-align:center;background:var(--pri);color:#fff;border-radius:4px;font-size:11px;font-weight:bold;padding:2px 0}
.num{font-weight:bold;min-width:56px}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:13px}
.cr.multi{align-items:flex-start}
.cs{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cd{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:5px;border:2px solid transparent}
.cd.pr{border-color:#2196f3}.cd.st{border-color:#4caf50}.cd.pr.st{box-shadow:0 0 0 2px #4caf50 inset}
.cr.hit{background:var(--hit)}
.cr.nx{background:var(--next);font-weight:bold}
.cr.nx .ix{background:#e6a800}
.cr.pr{border:2px solid #2196f3;border-radius:6px;margin:2px 0}
.cr.st{border:2px solid #4caf50;border-radius:6px;margin:2px 0}
.cr.pr.st{box-shadow:0 0 0 2px #4caf50 inset}
.cr.pu{border:2px solid #9c27b0;border-radius:6px;margin:2px 0}
.cr.pu.pr{box-shadow:0 0 0 2px #2196f3 inset}
.cr.pu.st{box-shadow:0 0 0 2px #4caf50 inset}
.cr.pu.pr.st{box-shadow:0 0 0 2px #2196f3 inset,0 0 0 4px #4caf50 inset}
.tag{font-size:10px;font-weight:bold;color:#b37a00}
.dots{text-align:center;color:var(--sub);font-size:12px;padding:2px}
.info{font-size:12px;color:var(--sub);margin-top:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center;padding:12px}
.mc{background:var(--card);width:100%;max-width:500px;border-radius:12px;padding:16px;max-height:92vh;overflow-y:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:1000;display:none}
/* 配列は横スワイプ、中のカードは縦スクロール */
#seqList{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;align-items:flex-start;padding-bottom:8px;-webkit-overflow-scrolling:touch}
#seqList>.box{flex:0 0 92%;max-width:560px;max-height:78vh;overflow-y:auto;scroll-snap-align:start}
#seqList>.info{flex:0 0 100%}
#seqList>.box>.row:first-child{position:sticky;top:0;background:var(--card);z-index:2;padding-bottom:6px}
</style>
</head>
<body data-theme="light">
<header>
  <h1>アイカツ！排出配列メモ</h1>
  <div class="hb"><span class="chip" onclick="share()">URL共有</span><span class="chip" id="themeBtn">ダーク</span></div>
</header>
<nav><button class="on" onclick="tab(0)">配列</button><button onclick="tab(1)">カード</button></nav>

<div class="wrap">
  <div class="tab on" id="t0">
    <div class="lbl">配列番号（タップで絞り込み）</div>
    <div id="seqBtns" class="chips seqb"></div>
    <div class="lbl" style="margin-top:10px">カード検索（全体）</div>
    <div id="gui"></div>
    <div class="info" id="qinfo"></div>
    <button class="btn" style="width:100%;margin-top:10px" onclick="openSeq()">＋ 新しい配列を登録</button>
    <div id="seqList"></div>
  </div>
  <div class="tab" id="t1">
    <input id="cq" placeholder="番号・名前で検索" oninput="renderCards()">
    <button class="btn" style="width:100%;margin-top:10px" onclick="openCard()">＋ カードを1枚追加</button>
    <div class="box">
      <div style="font-size:12px;color:var(--sub);margin-bottom:6px">まとめて登録（1行に「番号 カード名」）</div>
      <textarea id="bulk" rows="3" placeholder="E1-01 スターフェスティバルコーデ&#10;E1-01PR ○○コーデ"></textarea>
      <button class="btn" style="width:100%;margin-top:6px" onclick="bulkAdd()">追加</button>
    </div>
    <div class="box" id="cardList" style="padding:0"></div>
  </div>
</div>

<div class="modal" id="sm"><div class="mc">
  <h3 style="color:var(--pri);margin-bottom:10px">配列の登録・編集</h3>
  <input type="hidden" id="sid">
  <div style="font-size:12px">配列の名称・番号（自由入力）</div>
  <input id="stitle" placeholder="配列【1】" autocomplete="off">
  <div style="font-size:12px">メモ（任意）</div>
  <textarea id="smemo" rows="2" style="margin-bottom:8px"></textarea>
  <div style="font-size:12px;color:var(--sub);margin-bottom:4px">各パターンにカード番号をスペースか改行区切りで入力。同じ位置に複数カードは「/」でつなぎます（例: E1-58/E1-59）。未登録の番号は自動でカード登録されます。</div>
  <div id="pats"></div>
  <button class="btn g sm" onclick="addPat()">＋ パターン追加</button>
  <div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeSeq()">キャンセル</button><button class="btn" style="flex:1" onclick="saveSeq()">保存</button></div>
</div></div>

<div class="modal" id="ecm"><div class="mc" style="max-width:380px">
  <h3 id="ecTitle" style="color:var(--pri);margin-bottom:10px">カード編集</h3>
  <input type="hidden" id="ecOld">
  <div style="font-size:12px">カード番号</div>
  <input id="ecNum" placeholder="E1-01" style="margin-bottom:8px" autocomplete="off">
  <div style="font-size:12px">カード名</div>
  <input id="ecName" placeholder="カード名" autocomplete="off">
  <div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeCard()">キャンセル</button><button class="btn" style="flex:1" onclick="saveCard()">保存</button></div>
</div></div>

<div class="modal" id="cm" style="z-index:200"><div class="mc" style="max-width:340px;text-align:center">
  <p id="cmsg" style="font-size:14px;margin-bottom:14px"></p>
  <div class="row"><button class="btn g" style="flex:1" onclick="cmClose()">いいえ</button><button class="btn r" style="flex:1" id="cok">削除する</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// seqs:[{id,title,memo,pats:[{name,nums:["E1-01","E1-58|E1-59"],total}]}]  ※「|」は同じ位置の複数カード
let db={cards:[],seqs:[],marks:{}};
let editPats=[],tt=null;
let selSeq=[];      // 絞り込み中の配列ID（空＝すべて）
let inOpen={};      // 配列内検索を開いているか
const newCur=()=>({series:'',pr:false,st:false,plain:true,num:''});
const newQ=()=>({steps:[],cur:newCur()});
let gQ=newQ();      // 全体の検索状態
let inQ={};         // 配列ごとの検索状態（全体と同じ仕組み）
const getQ=sc=>sc==='g'?gQ:(inQ[sc]||(inQ[sc]=newQ()));

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').normalize('NFKC').trim().toUpperCase();
const toks=s=>norm(s).split(/[\s,、]+/).filter(Boolean);
// 位置の入力：スペース区切り＝位置、「/」「+」「|」＝同じ位置に複数カード
const posToks=s=>toks(s).map(t=>t.split(/[|\/+]/).filter(Boolean).join('|')).filter(Boolean);
const nameOf=n=>{const c=db.cards.find(c=>c.n===n);return c?c.name:''};
const INFO='配列番号はボタンで絞り込み。シリーズ・種類はボタン、番号は「17 28 19」のようにスペース区切り。種類は初期状態が「記号なし」（30だけ）。⭐やPR付きも見たいときは「すべて」。カードを長押しで、その場所だけ紫枠。';

function totalOf(p){const t=parseInt(p.total,10);return t>0?t:100}
function cnt(p){return p.nums.length+'/'+totalOf(p)+'枚'}

// ---- カード番号を分解（E1-30PR → シリーズE1 / 番号30 / PR。30R のような他の文字は extra） ----
const SUF=/(PR|[\u2B50\u2605\u2606]\uFE0F?)+$/u;
function parse(n){
  const core=n.replace(SUF,'');
  const i=core.lastIndexOf('-');
  let series='',numStr='',num=null,extra=false;
  if(i>=0){series=core.slice(0,i);numStr=core.slice(i+1)}
  else{const m=core.match(/^(.*?)(\d+\D*)$/);if(m){series=m[1];numStr=m[2]}else series=core}
  const mm=numStr.match(/^(\d+)(.*)$/);
  if(mm){num=parseInt(mm[1],10);extra=mm[2]!==''}
  else if(numStr)extra=true;
  return{series,num,pr:/PR/.test(n),st:/[\u2B50\u2605\u2606]/u.test(n),extra};
}

// ---- 検索条件（位置内のどれか1枚に当たればOK） ----
const curEmpty=c=>!c.series&&!c.pr&&!c.st&&!c.num;
function stepLabel(s){
  if(s.exact)return s.exact;
  const base=[s.series,s.num,s.pr?'PR':'',s.st?'⭐':''].filter(Boolean).join('·');
  const all=!s.plain&&!s.pr&&!s.st&&(s.series||s.num);
  return (base||'—')+(all?'（記号込）':'');
}
function matchOne(n,s,partial){
  const c=parse(n);
  if(s.series&&c.series!==s.series)return false;
  if(s.plain&&(c.pr||c.st||c.extra))return false;   // 記号なし：PR・⭐・その他の文字が付いたものを除く
  if(s.pr&&!c.pr)return false;
  if(s.st&&!c.st)return false;
  if(s.num){
    if(c.num===null)return false;
    if(partial){
      const pad=String(c.num).padStart(2,'0'),a=String(c.num),ts=s.num.replace(/^0+/,'');
      return pad.startsWith(s.num)||(ts!==''&&a.startsWith(ts));
    }
    return c.num===parseInt(s.num,10);
  }
  return true;
}
function stepMatch(pos,s,partial){
  const cs=pos.split('|');
  if(s.exact)return cs.includes(s.exact);
  return cs.some(c=>matchOne(c,s,partial));
}
function qSteps(q){
  const a=q.steps.map(s=>Object.assign({},s,{live:false}));
  if(!curEmpty(q.cur))a.push(Object.assign({},q.cur,{live:true}));
  return a;
}
function allSeries(seq){
  const set={};
  const add=pos=>pos.split('|').forEach(n=>{const s=parse(n).series;if(s)set[s]=1});
  if(seq)seq.pats.forEach(p=>p.nums.forEach(add));
  else db.cards.forEach(c=>{const s=parse(c.n).series;if(s)set[s]=1});
  return Object.keys(set).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
}

// ---- 検索UI（全体も配列内も同じもの） ----
function qUI(sc){
  const e=esc(sc);
  return `<div class="chips" id="qc_${e}"></div>
<div class="lbl">シリーズ</div><div class="chips" id="qs_${e}"></div>
<div class="lbl">種類</div><div class="chips" id="qk_${e}"></div>
<div class="row"><input id="qn_${e}" placeholder="番号を入力 例: 17 28 19（スペースで確定）" value="${esc(getQ(sc).cur.num)}" oninput="onNum('${e}')" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmStep('${e}')}" autocomplete="off"><button class="btn" onclick="confirmStep('${e}')">確定</button></div>
<div class="row" style="margin-top:6px"><button class="btn g sm" onclick="backStep('${e}')">1つ戻す</button><button class="btn g sm" onclick="clearQ('${e}')">全消し</button></div>`;
}
function fillQ(sc){
  const a=$('qc_'+sc);if(!a)return;
  const q=getQ(sc),c=q.cur,e=esc(sc);
  a.innerHTML=q.steps.map((s,i)=>`<span class="sc" onclick="rmStep('${e}',${i})">${i+1}. ${esc(stepLabel(s))} ×</span>`).join('');
  const ser=allSeries(sc==='g'?null:db.seqs.find(s=>s.id===sc));
  $('qs_'+sc).innerHTML=ser.length?ser.map(s=>`<button class="fb${c.series===s?' on':''}" data-q="${e}" data-s="${esc(s)}" onclick="pickSeries(this.dataset.q,this.dataset.s)">${esc(s)}</button>`).join(''):'<span class="info">シリーズなし</span>';
  const all=!c.plain&&!c.pr&&!c.st;
  $('qk_'+sc).innerHTML=`<button class="fb${all?' on':''}" onclick="setKind('${e}','all')">すべて</button><button class="fb${c.plain?' on':''}" onclick="setKind('${e}','plain')">記号なし</button><button class="fb pr${c.pr?' on':''}" onclick="setKind('${e}','pr')">PR</button><button class="fb st${c.st?' on':''}" onclick="setKind('${e}','st')">⭐</button>`;
}
function changed(sc){if(sc==='g')renderSeq();else refreshSeq(sc)}
function resetCur(sc){getQ(sc).cur=newCur();const i=$('qn_'+sc);if(i)i.value=''}
function pickSeries(sc,s){const c=getQ(sc).cur;c.series=c.series===s?'':s;changed(sc)}
function setKind(sc,k){
  const c=getQ(sc).cur;
  if(k==='all'){c.plain=false;c.pr=false;c.st=false}
  else if(k==='plain'){c.plain=true;c.pr=false;c.st=false}
  else{c[k]=!c[k];if(c[k])c.plain=false}
  changed(sc);
}
function onNum(sc){
  const q=getQ(sc),c=q.cur,inp=$('qn_'+sc);
  const v=norm(inp.value).replace(/[^\d\s,、]/g,'');
  const parts=v.split(/[\s,、]+/);
  const last=/[\s,、]$/.test(v)?'':parts.pop();
  parts.filter(Boolean).forEach(p=>q.steps.push({series:c.series,pr:c.pr,st:c.st,plain:c.plain,num:p}));
  c.num=last;inp.value=last;
  changed(sc);
}
function confirmStep(sc){
  const q=getQ(sc),c=q.cur;
  if(curEmpty(c)){toast('ボタンを選ぶか番号を入力してください');return}
  q.steps.push({series:c.series,pr:c.pr,st:c.st,plain:c.plain,num:c.num});
  resetCur(sc);changed(sc);
}
function backStep(sc){
  const q=getQ(sc);
  if(!curEmpty(q.cur))resetCur(sc);else q.steps.pop();
  changed(sc);
}
function rmStep(sc,i){getQ(sc).steps.splice(i,1);changed(sc)}
function clearQ(sc){getQ(sc).steps=[];resetCur(sc);changed(sc)}
function addNext(sc,prevPos,n){
  const q=getQ(sc),c=q.cur;
  if(!curEmpty(c)){
    if(prevPos){const pc=prevPos.split('|');q.steps.push({exact:pc.find(x=>stepMatch(x,c,true))||pc[0]})}
    resetCur(sc);
  }
  q.steps.push({exact:n});changed(sc);
}

// ---- 枠（PR=青 / ⭐=緑 / 長押し=紫） ----
function frame(n,key){
  let c='';
  if(/PR/.test(n))c+=' pr';
  if(/[\u2B50\u2605\u2606]/u.test(n))c+=' st';
  if(key&&db.marks&&db.marks[key]===n)c+=' pu';
  return c;
}

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
function save(){try{localStorage.setItem('aikatsu_db2',JSON.stringify(db))}catch(e){toast('保存に失敗しました')}}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem('aikatsu_db2'));
    if(d&&d.cards){
      db=d;
      if(!db.marks)db.marks={};
      if(!db.seqs)db.seqs=[];
      Object.keys(db.marks).forEach(k=>{if(k.indexOf(':')<0)delete db.marks[k]});
      return;
    }
  }catch(e){}
  try{
    const o=JSON.parse(localStorage.getItem('aikatsu_db'));
    if(o&&o.cards){
      const m={};o.cards.forEach(c=>{m[c.id]=norm(c.number)});
      db.cards=o.cards.map(c=>({n:norm(c.number),name:c.name||''}));
      db.seqs=(o.sequences||[]).map(s=>({id:s.id,memo:s.memo||'',pats:s.patterns.map(p=>({name:p.name,nums:p.cardIds.map(i=>m[i]).filter(Boolean)}))}));
      save();
    }
  }catch(e){}
}

// ---- 圧縮 ----
const b64=b=>{let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b};
const pipe=async(b,t)=>new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(t)).arrayBuffer());
async function pack(str){const r=new TextEncoder().encode(str);return window.CompressionStream?'z'+b64(await pipe(r,new CompressionStream('deflate-raw'))):'j'+b64(r)}
async function unpack(s){const b=unb64(s.slice(1));return new TextDecoder().decode(s[0]==='z'?await pipe(b,new DecompressionStream('deflate-raw')):b)}

// ---- 共有 ----
function legacyCopy(t){
  const a=document.createElement('textarea');
  a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  a.remove();return ok;
}

async function share(){
  let url='';
  try{
    const names={};db.cards.forEach(c=>{if(c.name)names[c.n]=c.name});
    const data={v:4,c:Object.entries(names),s:db.seqs.map(s=>{
      const row=[s.memo,s.pats.map((p,pi)=>{
        const ms=[];
        p.nums.forEach((n,i)=>{if(db.marks[s.id+':'+pi+':'+i]===n)ms.push(i)});
        const tot=totalOf(p);
        const r=[p.name,p.nums.join(' ')];
        if(ms.length||tot!==100)r.push(ms);
        if(tot!==100)r.push(tot);
        return r;
      })];
      if(s.title)row.push(s.title);
      return row;
    })};
    url=location.href.split(/[?#]/)[0]+'?s='+await pack(JSON.stringify(data));
  }catch(e){
    console.error(e);toast('URL作成に失敗しました');return;
  }
  const done=()=>toast('URLをコピー（'+url.length+'文字）');
  try{await navigator.clipboard.writeText(url);done();return}catch(e){}
  if(legacyCopy(url)){done();return}
  try{
    if(navigator.share){await navigator.share({url});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  prompt('コピーしてください',url);
}

async function initShared(){
  const s=new URLSearchParams(location.search).get('s');
  if(!s)return;
  history.replaceState({},document.title,location.pathname);
  try{
    const o=JSON.parse(await unpack(s));
    if(o.v!==4){toast('古い形式の共有URLです');return}
    const cards=[],seen={},marks={};
    const add=(n,name)=>{n=norm(n);if(!n)return;if(!seen[n]){seen[n]=1;cards.push({n,name:name||''})}else if(name){cards.find(c=>c.n===n).name=name}};
    (o.c||[]).forEach(r=>add(r[0],String(r[1]||'')));
    const seqs=(o.s||[]).map((r,i)=>{
      const id='s'+Date.now()+i;
      return{id,title:String(r[2]||''),memo:String(r[0]||''),pats:(r[1]||[]).map((p,pi)=>{
        const nums=posToks(p[1]||'');
        (Array.isArray(p[2])?p[2]:[]).forEach(x=>{if(Number.isInteger(x)&&nums[x])marks[id+':'+pi+':'+x]=nums[x]});
        const tot=parseInt(p[3],10);
        return{name:String(p[0]||''),nums,total:(tot>0&&tot<=9999)?tot:100};
      })};
    });
    seqs.forEach(s=>s.pats.forEach(p=>p.nums.forEach(pos=>pos.split('|').forEach(n=>add(n,'')))));
    const ok=()=>{db={cards,seqs,marks};selSeq=[];inQ={};save();renderSeq();renderCards();toast('共有データを読み込みました')};
    if(db.cards.length||db.seqs.length){ask('この端末のデータが共有データで置き換わります。よろしいですか？',ok,'読み込む')}else ok();
  }catch(e){toast('共有データの読み込みに失敗しました')}
}
// ---- 表示 ----
function tab(i){document.querySelectorAll('nav button').forEach((b,k)=>b.classList.toggle('on',k===i));document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));i?renderCards():renderSeq()}

// 1つの位置（複数カードなら縦に並べる）
function row(i,pos,cls,tag,key){
  const cs=pos.split('|');
  const tg=tag?`<span class="tag">${tag}</span>`:'';
  const attr=`data-n="${esc(pos)}" data-k="${esc(key||'')}"`;
  if(cs.length===1){
    return `<div class="cr ${cls||''}${frame(pos,key)}" ${attr}><span class="ix">${i+1}</span><span class="num">${esc(pos)}</span><span class="nm">${esc(nameOf(pos))}</span>${tg}</div>`;
  }
  const inner=cs.map(c=>`<div class="cd${frame(c)}"><span class="num">${esc(c)}</span><span class="nm">${esc(nameOf(c))}</span></div>`).join('');
  const pu=(key&&db.marks[key]===pos)?' pu':'';
  return `<div class="cr multi ${cls||''}${pu}" ${attr}><span class="ix">${i+1}</span><div class="cs">${inner}</div>${tg}</div>`;
}

function findPos(nums,t){
  const k=t.length,res=[];
  for(let i=0;i+k<=nums.length;i++){
    let ok=true;
    for(let j=0;j<k;j++){
      if(!stepMatch(nums[i+j],t[j],t[j].live)){ok=false;break}
    }
    if(ok)res.push(i);
  }
  return res;
}

// パターンの見出し：名称の重複は出さず、枚数は必ず出す
const defName=n=>!n||/^\d+通り目$/.test(n)||n==='無題';
function patHead(s,p,extra){
  const showName=s.pats.length>1||!(defName(p.name)||p.name===(s.title||''));
  return (showName?`<b>${esc(p.name)}</b>`:'')+`<span class="cn">${cnt(p)}</span>`+(extra?` <span class="info">${extra}</span>`:'');
}

// 検索結果：一致した位置から配列の最後まで全部出す（全体も配列内も同じ）
function normalBody(s,t,sc){
  const live=t.length>0&&t[t.length-1].live;
  let h='',hits=0;
  s.pats.forEach((p,pi)=>{
    const K=x=>s.id+':'+pi+':'+x;
    if(!t.length){
      h+=`<div class="pat">${patHead(s,p)}<div class="lst">${p.nums.map((n,i)=>row(i,n,'','',K(i))).join('')||'<div class="dots">カードなし</div>'}</div></div>`;
      return;
    }
    findPos(p.nums,t).forEach(i=>{
      hits++;
      const k=t.length,end=i+k,from=i,to=p.nums.length;
      let r='';
      if(from>0)r+='<div class="dots">⋮</div>';
      for(let x=from;x<to;x++){
        r+=row(x,p.nums[x],x<end?'hit':(x===end?'nx':''),x===end?'次':'',K(x));
      }
      const nx=p.nums[end];
      const prev=live?p.nums[end-1]:'';
      const btns=nx?nx.split('|').map(c=>`<button class="btn sm" style="margin:6px 6px 0 0" data-p="${esc(prev)}" data-n="${esc(c)}" onclick="addNext('${esc(sc)}',this.dataset.p,this.dataset.n)">次が出た：${esc(c)} を追加</button>`).join(''):'<div class="info">この配列はここで終わりです</div>';
      h+=`<div class="pat">${patHead(s,p,end+'枚目まで一致')}<div class="lst">${r}</div>${btns}</div>`;
    });
  });
  return{h,hits};
}

// 配列の本文：その配列内に検索条件があればそちらを優先、なければ全体の条件
function seqBody(s){
  const iq=inQ[s.id],it=iq?qSteps(iq):[];
  if(it.length){
    const r=normalBody(s,it,s.id);
    return{h:r.h||'<div class="info">一致する位置はありません</div>',hits:0};
  }
  return normalBody(s,qSteps(gQ),'g');
}
function refreshSeq(sid){
  const s=db.seqs.find(x=>x.id===sid),el=$('sb_'+sid);
  if(!s||!el)return;
  fillQ(sid);
  el.innerHTML=seqBody(s).h;
}

// ---- 配列番号ボタン ----
function seqNo(s,si){const m=String(s.title||'').match(/\d+/);return m?m[0]:String(si+1)}
function renderSeqBtns(){
  const b=$('seqBtns');
  if(!db.seqs.length){b.innerHTML='<span class="info">配列を登録するとボタンが出ます</span>';return}
  b.innerHTML=`<button class="fb${selSeq.length?'':' on'}" onclick="selAll()">すべて</button>`+db.seqs.map((s,si)=>`<button class="fb${selSeq.includes(s.id)?' on':''}" data-i="${esc(s.id)}" onclick="togSeq(this.dataset.i)">${esc(seqNo(s,si))}</button>`).join('');
}
function selAll(){selSeq=[];renderSeq()}
function togSeq(id){
  const i=selSeq.indexOf(id);
  if(i>=0)selSeq.splice(i,1);else selSeq.push(id);
  renderSeq();
}

function renderSeq(){
  renderSeqBtns();fillQ('g');
  const gt=qSteps(gQ),live=gt.length>0&&gt[gt.length-1].live;
  const box=$('seqList');
  let h='',hits=0;const ids=[];
  db.seqs.forEach((s,si)=>{
    if(selSeq.length&&!selSeq.includes(s.id))return;
    const r=seqBody(s);
    if(!r.h)return;
    hits+=r.hits;ids.push(s.id);
    const title=s.title||('配列'+(si+1));
    const act=qSteps(getQ(s.id)).length>0;
    h+=`<div class="box"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><div class="seq-t">${esc(title)}</div>${s.memo?`<div class="seq-m">${esc(s.memo)}</div>`:''}</div><span style="white-space:nowrap"><button class="btn sm" onclick="openSeq('${esc(s.id)}')">編集</button> <button class="btn sm r" onclick="delSeq('${esc(s.id)}')">削除</button></span></div><details class="isd"${(inOpen[s.id]||act)?' open':''} ontoggle="inOpen['${esc(s.id)}']=this.open"><summary>この配列の中を検索</summary>${qUI(s.id)}</details><div id="sb_${esc(s.id)}">${r.h}</div></div>`;
  });
  box.innerHTML=h||((gt.length||selSeq.length)?'<div class="info" style="text-align:center;margin-top:16px">一致する配列はありません</div>':'<div class="info" style="text-align:center;margin-top:16px">配列が未登録です</div>');
  ids.forEach(fillQ);
  $('qinfo').textContent=gt.length?`条件 ${gt.length}枚${live?'（最後は入力中）':''} → 一致 ${hits}件`:INFO;
}

// ---- 長押しで紫枠（押した場所だけ） ----
let lp=null,lx=0,ly=0;
(function(){
  const sl=$('seqList');
  sl.addEventListener('pointerdown',e=>{
    const r=e.target.closest('.cr[data-k]');if(!r||!r.dataset.k)return;
    lx=e.clientX;ly=e.clientY;clearTimeout(lp);
    lp=setTimeout(()=>{lp=null;toggleMark(r.dataset.k,r.dataset.n)},550);
  });
  sl.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lx)>10||Math.abs(e.clientY-ly)>10)clearTimeout(lp)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>sl.addEventListener(ev,()=>clearTimeout(lp)));
  sl.addEventListener('contextmenu',e=>{if(e.target.closest('.cr'))e.preventDefault()});
})();
function toggleMark(key,n){
  if(!db.marks)db.marks={};
  if(db.marks[key]===n){delete db.marks[key];toast('紫枠を外しました')}
  else{db.marks[key]=n;toast('紫枠をつけました')}
  save();renderSeq();
}

// ---- カード ----
function renderCards(){
  const q=norm($('cq').value);
  const l=db.cards.filter(c=>!q||norm(c.n).includes(q)||norm(c.name).includes(q));
  $('cardList').innerHTML=l.map(c=>`<div class="cr${frame(c.n)}"><span class="num">${esc(c.n)}</span><span class="nm">${esc(c.name)||'（名前なし）'}</span><button class="btn sm" onclick="openCard('${esc(c.n)}')">編集</button><button class="btn sm r" onclick="delCard('${esc(c.n)}')">削除</button></div>`).join('')||'<div class="dots" style="padding:14px">カードがありません</div>';
}
function openCard(n){
  const c=n&&db.cards.find(x=>x.n===n);
  $('ecTitle').textContent=c?'カード編集':'カード追加';
  $('ecOld').value=c?c.n:'';
  $('ecNum').value=c?c.n:'';
  $('ecName').value=c?c.name:'';
  $('ecm').style.display='flex';
}
function closeCard(){$('ecm').style.display='none'}
function saveCard(){
  const old=$('ecOld').value,nn=norm($('ecNum').value).replace(/[|\/+\s]/g,''),name=$('ecName').value.trim();
  if(!nn){toast('カード番号を入力してください');return}
  if(old){
    const c=db.cards.find(x=>x.n===old);
    if(!c){closeCard();return}
    if(nn!==old){
      if(db.cards.find(x=>x.n===nn)){toast('その番号は既に登録されています');return}
      const rp=pos=>pos.split('|').map(x=>x===old?nn:x).join('|');
      db.seqs.forEach(s=>s.pats.forEach(p=>{p.nums=p.nums.map(rp)}));
      Object.keys(db.marks).forEach(k=>{db.marks[k]=rp(db.marks[k])});
      [gQ].concat(Object.values(inQ)).forEach(q=>q.steps.forEach(s=>{if(s.exact===old)s.exact=nn}));
      c.n=nn;
    }
    c.name=name;
  }else{
    const c=db.cards.find(x=>x.n===nn);
    if(c)c.name=name||c.name;else db.cards.push({n:nn,name});
  }
  save();closeCard();renderCards();renderSeq();toast('保存しました');
}
function cmClose(){$('cm').style.display='none'}
function ask(msg,cb,label){$('cmsg').textContent=msg;$('cok').textContent=label||'削除する';$('cok').onclick=()=>{cmClose();cb()};$('cm').style.display='flex'}
function delCard(n){ask(n+' を削除しますか？（配列内の番号は残ります）',()=>{db.cards=db.cards.filter(c=>c.n!==n);save();renderCards();renderSeq()})}
function bulkAdd(){
  $('bulk').value.split('\n').forEach(line=>{
    const m=line.normalize('NFKC').trim().match(/^(\S+)\s*(.*)$/);if(!m)return;
    const n=norm(m[1]),c=db.cards.find(c=>c.n===n);
    if(c){if(m[2])c.name=m[2]}else db.cards.push({n,name:m[2]||''});
  });
  $('bulk').value='';save();renderCards();renderSeq();toast('追加しました');
}

// ---- 配列編集 ----
function openSeq(sid){
  const s=sid&&db.seqs.find(x=>x.id===sid);
  $('sid').value=s?s.id:'';
  $('stitle').value=s?(s.title||''):'';
  $('smemo').value=s?s.memo:'';
  editPats=s?s.pats.map(p=>({name:p.name,txt:p.nums.map(x=>x.replace(/\|/g,'/')).join(' '),total:totalOf(p)})):[{name:'1通り目',txt:'',total:100}];
  drawPats();$('sm').style.display='flex';
}
function closeSeq(){$('sm').style.display='none'}
function drawPats(){
  $('pats').innerHTML=editPats.map((p,i)=>`<div class="box" style="margin-top:8px"><div class="row" style="margin-bottom:6px"><input value="${esc(p.name)}" oninput="editPats[${i}].name=this.value"><button class="btn sm r" onclick="editPats.splice(${i},1);drawPats()">削除</button></div><div class="row" style="margin-bottom:6px"><span style="font-size:12px;color:var(--sub);white-space:nowrap">総枚数</span><input type="number" inputmode="numeric" min="1" max="9999" value="${esc(p.total)}" oninput="editPats[${i}].total=this.value" style="width:90px"><span style="font-size:12px;color:var(--sub)">枚（100/100枚の分母）</span></div><textarea rows="4" placeholder="E1-01 E1-02/E1-03 E1-04PR ..." oninput="editPats[${i}].txt=this.value">${esc(p.txt)}</textarea></div>`).join('');
}
function addPat(){editPats.push({name:(editPats.length+1)+'通り目',txt:'',total:100});drawPats()}
function saveSeq(){
  const pats=editPats.map(p=>({name:p.name.trim()||'無題',nums:posToks(p.txt),total:Math.min(9999,Math.max(1,parseInt(p.total,10)||100))}));
  pats.forEach(p=>p.nums.forEach(pos=>pos.split('|').forEach(n=>{if(!db.cards.find(c=>c.n===n))db.cards.push({n,name:''})})));
  const sid=$('sid').value||'s'+Date.now();
  const d={id:sid,title:$('stitle').value.trim(),memo:$('smemo').value.trim(),pats};
  const i=db.seqs.findIndex(s=>s.id===sid);
  if(i>=0)db.seqs[i]=d;else db.seqs.push(d);
  save();closeSeq();renderSeq();
}
function delSeq(sid){ask('この配列を削除しますか？',()=>{
  db.seqs=db.seqs.filter(s=>s.id!==sid);
  selSeq=selSeq.filter(x=>x!==sid);
  delete inQ[sid];delete inOpen[sid];
  Object.keys(db.marks).forEach(k=>{if(k.indexOf(sid+':')===0)delete db.marks[k]});
  save();renderSeq();
})}

$('themeBtn').onclick=()=>{const d=document.body.dataset.theme==='dark';document.body.dataset.theme=d?'light':'dark';$('themeBtn').textContent=d?'ダーク':'ライト'};

load();
$('gui').innerHTML=qUI('g');
renderSeq();initShared();
</script>
