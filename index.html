<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイカツ！アンコール 排出配列メモ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#333;--sub:#666;--pri:#ff4081;--bd:#e0e0e0;--acc:#fff0f5;--hit:#ffe0ec;--next:#fff3b0}
[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--sub:#aaa;--bd:#333;--acc:#2a1b24;--hit:#4a1f33;--next:#5a4a00}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:60px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:14px;color:var(--pri)}
.hb{display:flex;gap:6px}
.chip{background:var(--acc);border:1px solid var(--pri);color:var(--pri);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;cursor:pointer}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:11px;background:none;border:none;border-bottom:3px solid transparent;color:var(--sub);font-weight:bold;font-size:14px}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
.wrap{max-width:600px;margin:0 auto;padding:12px}
.tab{display:none}.tab.on{display:block}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:15px}
textarea{resize:vertical}
#smemo{font-size:17px;font-weight:bold}
.memo-t{font-size:16px;font-weight:bold}
.btn{background:var(--pri);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}
.g{background:#757575}.r{background:#f44336}.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px}
.pat{background:var(--acc);border-radius:8px;padding:8px;margin-top:8px}
.pat b{font-size:12px;color:var(--pri)}
.cr{display:flex;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px}
.cr:last-child{border:none}
#seqList .cr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ix{min-width:26px;text-align:center;background:var(--pri);color:#fff;border-radius:4px;font-size:11px;font-weight:bold;padding:2px 0}
.num{font-weight:bold;min-width:56px}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:13px}
.cr.hit{background:var(--hit)}
.cr.nx{background:var(--next);font-weight:bold}
.cr.nx .ix{background:#e6a800}
.cr.pr{border:2px solid #2196f3;border-radius:6px;margin:2px 0}
.cr.st{border:2px solid #4caf50;border-radius:6px;margin:2px 0}
.cr.pr.st{box-shadow:0 0 0 2px #4caf50 inset}
.cr.pu{border:2px solid #9c27b0;border-radius:6px;margin:2px 0}
.cr.pu.pr{box-shadow:0 0 0 2px #2196f3 inset}
.cr.pu.st{box-shadow:0 0 0 2px #4caf50 inset}
.cr.pu.pr.st{box-shadow:0 0 0 2px #2196f3 inset,0 0 0 4px #4caf50 inset}
.tag{font-size:10px;font-weight:bold;color:#b37a00}
.dots{text-align:center;color:var(--sub);font-size:12px;padding:2px}
.info{font-size:12px;color:var(--sub);margin-top:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center;padding:12px}
.mc{background:var(--card);width:100%;max-width:500px;border-radius:12px;padding:16px;max-height:92vh;overflow-y:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:1000;display:none}
</style>
</head>
<body data-theme="light">
<header>
  <h1>アイカツ！排出配列メモ</h1>
  <div class="hb"><span class="chip" onclick="share()">URL共有</span><span class="chip" id="themeBtn">ダーク</span></div>
</header>
<nav><button class="on" onclick="tab(0)">配列</button><button onclick="tab(1)">カード</button></nav>

<div class="wrap">
  <div class="tab on" id="t0">
    <div class="row"><input id="q" placeholder="出た番号を順に入力 例: 01 03 05（E1-01なら01でOK）" oninput="renderSeq()" autocomplete="off"><button class="btn g" onclick="clearQ()">消</button></div>
    <div class="info" id="qinfo"></div>
    <button class="btn" style="width:100%;margin-top:10px" onclick="openSeq()">＋ 新しい配列を登録</button>
    <div id="seqList"></div>
  </div>
  <div class="tab" id="t1">
    <input id="cq" placeholder="番号・名前で検索" oninput="renderCards()">
    <button class="btn" style="width:100%;margin-top:10px" onclick="openCard()">＋ カードを1枚追加</button>
    <div class="box">
      <div style="font-size:12px;color:var(--sub);margin-bottom:6px">まとめて登録（1行に「番号 カード名」）</div>
      <textarea id="bulk" rows="3" placeholder="E1-01 スターフェスティバルコーデ&#10;E1-01PR ○○コーデ"></textarea>
      <button class="btn" style="width:100%;margin-top:6px" onclick="bulkAdd()">追加</button>
    </div>
    <div class="box" id="cardList" style="padding:0"></div>
  </div>
</div>

<div class="modal" id="sm"><div class="mc">
  <h3 style="color:var(--pri);margin-bottom:10px">配列の登録・編集</h3>
  <input type="hidden" id="sid">
  <div style="font-size:12px">メモ（任意）</div>
  <textarea id="smemo" rows="2" style="margin-bottom:8px"></textarea>
  <div style="font-size:12px;color:var(--sub);margin-bottom:4px">各パターンにカード番号をスペースか改行区切りで入力。未登録の番号は自動でカード登録されます。</div>
  <div id="pats"></div>
  <button class="btn g sm" onclick="addPat()">＋ パターン追加</button>
  <div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeSeq()">キャンセル</button><button class="btn" style="flex:1" onclick="saveSeq()">保存</button></div>
</div></div>

<div class="modal" id="ecm"><div class="mc" style="max-width:380px">
  <h3 id="ecTitle" style="color:var(--pri);margin-bottom:10px">カード編集</h3>
  <input type="hidden" id="ecOld">
  <div style="font-size:12px">カード番号</div>
  <input id="ecNum" placeholder="E1-01" style="margin-bottom:8px" autocomplete="off">
  <div style="font-size:12px">カード名</div>
  <input id="ecName" placeholder="カード名" autocomplete="off">
  <div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="closeCard()">キャンセル</button><button class="btn" style="flex:1" onclick="saveCard()">保存</button></div>
</div></div>

<div class="modal" id="cm" style="z-index:200"><div class="mc" style="max-width:340px;text-align:center">
  <p id="cmsg" style="font-size:14px;margin-bottom:14px"></p>
  <div class="row"><button class="btn g" style="flex:1" onclick="cmClose()">いいえ</button><button class="btn r" style="flex:1" id="cok">削除する</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
let db={cards:[],seqs:[],marks:{}}; // cards:[{n,name}] seqs:[{id,memo,pats:[{name,nums:[],total}]}] marks:{"配列ID:パターン番号:位置":カード番号}
let editPats=[],tt=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').normalize('NFKC').trim().toUpperCase();
const toks=s=>norm(s).split(/[\s,、]+/).filter(Boolean);
const nameOf=n=>{const c=db.cards.find(c=>c.n===n);return c?c.name:''};
const INFO='番号をスペース区切りで順に入れると、一致する配列と「次のカード」が出ます。01だけでE1-01もヒット。番号のあとにスペースで確定。カードを長押しで、その場所だけ紫枠（共有URLにも入ります）。';

// ---- 枚数表記（7/100枚） ----
function totalOf(p){const t=parseInt(p.total,10);return t>0?t:100}
function cnt(p){return p.nums.length+'/'+totalOf(p)+'枚'}

// ---- 広い検索（E1-01 を 01 や 1 でもヒット） ----
const SUF=/(PR|[\u2B50\u2605\u2606]\uFE0F?)+$/u;
function keys(n){
  const core=n.replace(SUF,'');
  const tail=core.split('-').pop();
  return [n,core,tail,tail.replace(/^0+/,''),n.replace(/-/g,''),core.replace(/-/g,'')].filter(Boolean);
}
function tmatch(n,t,partial){
  return keys(n).some(k=>partial?k.includes(t):k===t);
}

// ---- 枠（PR=青 / ⭐=緑 / 長押し=紫：押した場所だけ） ----
function frame(n,key){
  let c='';
  if(/PR/.test(n))c+=' pr';
  if(/[\u2B50\u2605\u2606]/u.test(n))c+=' st';
  if(key&&db.marks&&db.marks[key]===n)c+=' pu';
  return c;
}

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
function save(){try{localStorage.setItem('aikatsu_db2',JSON.stringify(db))}catch(e){toast('保存に失敗しました')}}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem('aikatsu_db2'));
    if(d&&d.cards){
      db=d;
      if(!db.marks)db.marks={};
      // 旧仕様（カード単位）の紫枠は破棄
      Object.keys(db.marks).forEach(k=>{if(k.indexOf(':')<0)delete db.marks[k]});
      return;
    }
  }catch(e){}
  // 旧データから移行（画像は使いません）
  try{
    const o=JSON.parse(localStorage.getItem('aikatsu_db'));
    if(o&&o.cards){
      const m={};o.cards.forEach(c=>{m[c.id]=norm(c.number)});
      db.cards=o.cards.map(c=>({n:norm(c.number),name:c.name||''}));
      db.seqs=(o.sequences||[]).map(s=>({id:s.id,memo:s.memo||'',pats:s.patterns.map(p=>({name:p.name,nums:p.cardIds.map(i=>m[i]).filter(Boolean)}))}));
      save();
    }
  }catch(e){}
}

// ---- 圧縮 ----
const b64=b=>{let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b};
const pipe=async(b,t)=>new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(t)).arrayBuffer());
async function pack(str){const r=new TextEncoder().encode(str);return window.CompressionStream?'z'+b64(await pipe(r,new CompressionStream('deflate-raw'))):'j'+b64(r)}
async function unpack(s){const b=unb64(s.slice(1));return new TextDecoder().decode(s[0]==='z'?await pipe(b,new DecompressionStream('deflate-raw')):b)}

// ---- 共有（紫枠の位置・総枚数も入れる） ----
async function share(){
  try{
    const names={};db.cards.forEach(c=>{if(c.name)names[c.n]=c.name});
    const data={v:4,c:Object.entries(names),s:db.seqs.map(s=>[s.memo,s.pats.map((p,pi)=>{
      const ms=[];
      p.nums.forEach((n,i)=>{if(db.marks[s.id+':'+pi+':'+i]===n)ms.push(i)});
      const tot=totalOf(p);
      const r=[p.name,p.nums.join(' ')];
      if(ms.length||tot!==100)r.push(ms);
      if(tot!==100)r.push(tot);
      return r;
    })])};
    const url=location.href.split(/[?#]/)[0]+'?s='+await pack(JSON.stringify(data));
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);toast('URLをコピー（'+url.length+'文字）')}
    else prompt('コピーしてください',url);
  }catch(e){toast('URL作成に失敗しました')}
}

async function initShared(){
  const s=new URLSearchParams(location.search).get('s');
  if(!s)return;
  history.replaceState({},document.title,location.pathname);
  try{
    const o=JSON.parse(await unpack(s));
    if(o.v!==4){toast('古い形式の共有URLです');return}
    const cards=[],seen={},marks={};
    const add=(n,name)=>{n=norm(n);if(!n)return;if(!seen[n]){seen[n]=1;cards.push({n,name:name||''})}else if(name){cards.find(c=>c.n===n).name=name}};
    (o.c||[]).forEach(r=>add(r[0],String(r[1]||'')));
    const seqs=(o.s||[]).map((r,i)=>{
      const id='s'+Date.now()+i;
      return{id,memo:String(r[0]||''),pats:(r[1]||[]).map((p,pi)=>{
        const nums=toks(p[1]||'');
        (Array.isArray(p[2])?p[2]:[]).forEach(x=>{if(Number.isInteger(x)&&nums[x])marks[id+':'+pi+':'+x]=nums[x]});
        const tot=parseInt(p[3],10);
        return{name:String(p[0]||''),nums,total:(tot>0&&tot<=9999)?tot:100};
      })};
    });
    seqs.forEach(s=>s.pats.forEach(p=>p.nums.forEach(n=>add(n,''))));
    const ok=()=>{db={cards,seqs,marks};save();renderSeq();renderCards();toast('共有データを読み込みました')};
    if(db.cards.length||db.seqs.length){ask('この端末のデータが共有データで置き換わります。よろしいですか？',ok,'読み込む')}else ok();
  }catch(e){toast('共有データの読み込みに失敗しました')}
}

// ---- 表示 ----
function tab(i){document.querySelectorAll('nav button').forEach((b,k)=>b.classList.toggle('on',k===i));document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));i?renderCards():renderSeq()}
function clearQ(){$('q').value='';renderSeq()}
function addToQ(n){const q=$('q');q.value=(q.value.trim()+' '+n).trim()+' ';renderSeq();q.focus()}

function row(i,n,cls,tag,key){
  return `<div class="cr ${cls||''}${frame(n,key)}" data-n="${esc(n)}" data-k="${esc(key||'')}"><span class="ix">${i+1}</span><span class="num">${esc(n)}</span><span class="nm">${esc(nameOf(n))}</span>${tag?`<span class="tag">${tag}</span>`:''}</div>`;
}

function findPos(nums,t,exLast){
  const k=t.length,res=[];
  for(let i=0;i+k<=nums.length;i++){
    let ok=true;
    for(let j=0;j<k;j++){
      const partial=(j===k-1)&&!exLast;
      if(!tmatch(nums[i+j],t[j],partial)){ok=false;break}
    }
    if(ok)res.push(i);
  }
  return res;
}

function renderSeq(){
  const raw=$('q').value;
  const t=toks(raw),box=$('seqList');
  const exLast=/\s$/.test(raw);
  let h='',hits=0;
  db.seqs.forEach(s=>{
    let ph='';
    s.pats.forEach((p,pi)=>{
      const K=x=>s.id+':'+pi+':'+x;
      if(!t.length){
        ph+=`<div class="pat"><b>${esc(p.name)}</b>（${cnt(p)}）<div style="background:var(--card);border-radius:6px;margin-top:4px">${p.nums.map((n,i)=>row(i,n,'','',K(i))).join('')||'<div class="dots">カードなし</div>'}</div></div>`;
        return;
      }
      const pos=findPos(p.nums,t,exLast);
      pos.forEach(i=>{
        hits++;
        const k=t.length,end=i+k,from=Math.max(0,i-2),to=Math.min(p.nums.length,end+6);
        let r='';
        if(from>0)r+='<div class="dots">⋮</div>';
        for(let x=from;x<to;x++){
          r+=row(x,p.nums[x],x<end?(x>=i?'hit':''):(x===end?'nx':''),x===end?'次':'',K(x));
        }
        if(to<p.nums.length)r+='<div class="dots">⋮</div>';
        const nx=p.nums[end];
        ph+=`<div class="pat"><b>${esc(p.name)}</b>（${end}枚目まで一致 / ${cnt(p)}）<div style="background:var(--card);border-radius:6px;margin-top:4px">${r}</div>${nx?`<button class="btn sm" style="margin-top:6px" onclick="addToQ('${esc(nx)}')">次が出た：${esc(nx)} を追加</button>`:'<div class="info">この配列はここで終わりです</div>'}</div>`;
      });
    });
    if(ph)h+=`<div class="box"><div class="row" style="justify-content:space-between"><strong class="memo-t">${esc(s.memo)||'排出配列メモ'}</strong><span style="white-space:nowrap"><button class="btn sm" onclick="openSeq('${s.id}')">編集</button> <button class="btn sm r" onclick="delSeq('${s.id}')">削除</button></span></div>${ph}</div>`;
  });
  box.innerHTML=h||(t.length?'<div class="info" style="text-align:center;margin-top:16px">一致する配列はありません</div>':'<div class="info" style="text-align:center;margin-top:16px">配列が未登録です</div>');
  $('qinfo').textContent=t.length?`入力 ${t.length}枚 → 一致 ${hits}件`:INFO;
}

// ---- 長押しで紫枠（押した場所だけ） ----
let lp=null,lx=0,ly=0;
(function(){
  const sl=$('seqList');
  sl.addEventListener('pointerdown',e=>{
    const r=e.target.closest('.cr[data-k]');if(!r||!r.dataset.k)return;
    lx=e.clientX;ly=e.clientY;clearTimeout(lp);
    lp=setTimeout(()=>{lp=null;toggleMark(r.dataset.k,r.dataset.n)},550);
  });
  sl.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lx)>10||Math.abs(e.clientY-ly)>10)clearTimeout(lp)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>sl.addEventListener(ev,()=>clearTimeout(lp)));
  sl.addEventListener('contextmenu',e=>{if(e.target.closest('.cr'))e.preventDefault()});
})();
function toggleMark(key,n){
  if(!db.marks)db.marks={};
  if(db.marks[key]===n){delete db.marks[key];toast('紫枠を外しました')}
  else{db.marks[key]=n;toast(n+' に紫枠をつけました')}
  save();renderSeq();
}

// ---- カード ----
function renderCards(){
  const q=norm($('cq').value);
  const l=db.cards.filter(c=>!q||norm(c.name).includes(q)||keys(c.n).some(k=>k.includes(q)));
  $('cardList').innerHTML=l.map(c=>`<div class="cr${frame(c.n)}"><span class="num">${esc(c.n)}</span><span class="nm">${esc(c.name)||'（名前なし）'}</span><button class="btn sm" onclick="openCard('${esc(c.n)}')">編集</button><button class="btn sm r" onclick="delCard('${esc(c.n)}')">削除</button></div>`).join('')||'<div class="dots" style="padding:14px">カードがありません</div>';
}
function openCard(n){
  const c=n&&db.cards.find(x=>x.n===n);
  $('ecTitle').textContent=c?'カード編集':'カード追加';
  $('ecOld').value=c?c.n:'';
  $('ecNum').value=c?c.n:'';
  $('ecName').value=c?c.name:'';
  $('ecm').style.display='flex';
}
function closeCard(){$('ecm').style.display='none'}
function saveCard(){
  const old=$('ecOld').value,nn=norm($('ecNum').value),name=$('ecName').value.trim();
  if(!nn){toast('カード番号を入力してください');return}
  if(old){
    const c=db.cards.find(x=>x.n===old);
    if(!c){closeCard();return}
    if(nn!==old){
      if(db.cards.find(x=>x.n===nn)){toast('その番号は既に登録されています');return}
      db.seqs.forEach(s=>s.pats.forEach(p=>{p.nums=p.nums.map(x=>x===old?nn:x)}));
      Object.keys(db.marks).forEach(k=>{if(db.marks[k]===old)db.marks[k]=nn});
      c.n=nn;
    }
    c.name=name;
  }else{
    const c=db.cards.find(x=>x.n===nn);
    if(c)c.name=name||c.name;else db.cards.push({n:nn,name});
  }
  save();closeCard();renderCards();renderSeq();toast('保存しました');
}
function cmClose(){$('cm').style.display='none'}
function ask(msg,cb,label){$('cmsg').textContent=msg;$('cok').textContent=label||'削除する';$('cok').onclick=()=>{cmClose();cb()};$('cm').style.display='flex'}
function delCard(n){ask(n+' を削除しますか？（配列内の番号は残ります）',()=>{db.cards=db.cards.filter(c=>c.n!==n);save();renderCards();renderSeq()})}
function bulkAdd(){
  $('bulk').value.split('\n').forEach(line=>{
    const m=line.normalize('NFKC').trim().match(/^(\S+)\s*(.*)$/);if(!m)return;
    const n=norm(m[1]),c=db.cards.find(c=>c.n===n);
    if(c){if(m[2])c.name=m[2]}else db.cards.push({n,name:m[2]||''});
  });
  $('bulk').value='';save();renderCards();toast('追加しました');
}

// ---- 配列編集 ----
function openSeq(sid){
  const s=sid&&db.seqs.find(x=>x.id===sid);
  $('sid').value=s?s.id:'';$('smemo').value=s?s.memo:'';
  editPats=s?s.pats.map(p=>({name:p.name,txt:p.nums.join(' '),total:totalOf(p)})):[{name:'1通り目',txt:'',total:100}];
  drawPats();$('sm').style.display='flex';
}
function closeSeq(){$('sm').style.display='none'}
function drawPats(){
  $('pats').innerHTML=editPats.map((p,i)=>`<div class="box" style="margin-top:8px"><div class="row" style="margin-bottom:6px"><input value="${esc(p.name)}" oninput="editPats[${i}].name=this.value"><button class="btn sm r" onclick="editPats.splice(${i},1);drawPats()">削除</button></div><div class="row" style="margin-bottom:6px"><span style="font-size:12px;color:var(--sub);white-space:nowrap">総枚数</span><input type="number" inputmode="numeric" min="1" max="9999" value="${esc(p.total)}" oninput="editPats[${i}].total=this.value" style="width:90px"><span style="font-size:12px;color:var(--sub)">枚（7/100枚の分母）</span></div><textarea rows="4" placeholder="E1-01 E1-02PR E1-03 ..." oninput="editPats[${i}].txt=this.value">${esc(p.txt)}</textarea></div>`).join('');
}
function addPat(){editPats.push({name:(editPats.length+1)+'通り目',txt:'',total:100});drawPats()}
function saveSeq(){
  const pats=editPats.map(p=>({name:p.name.trim()||'無題',nums:toks(p.txt),total:Math.min(9999,Math.max(1,parseInt(p.total,10)||100))}));
  pats.forEach(p=>p.nums.forEach(n=>{if(!db.cards.find(c=>c.n===n))db.cards.push({n,name:''})}));
  const sid=$('sid').value||'s'+Date.now();
  const d={id:sid,memo:$('smemo').value.trim(),pats};
  const i=db.seqs.findIndex(s=>s.id===sid);
  if(i>=0)db.seqs[i]=d;else db.seqs.push(d);
  save();closeSeq();renderSeq();
}
function delSeq(sid){ask('この配列を削除しますか？',()=>{
  db.seqs=db.seqs.filter(s=>s.id!==sid);
  Object.keys(db.marks).forEach(k=>{if(k.indexOf(sid+':')===0)delete db.marks[k]});
  save();renderSeq();
})}

$('themeBtn').onclick=()=>{const d=document.body.dataset.theme==='dark';document.body.dataset.theme=d?'light':'dark';$('themeBtn').textContent=d?'ダーク':'ライト'};

load();renderSeq();initShared();
</script>
</body>
</html>
